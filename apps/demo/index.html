<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Draflow · ワークフロー</title>
    <style>
      :root { color-scheme: light dark; font: 16px/1.5 "Inter", system-ui, sans-serif }
      body { margin: 0; background: color-mix(in srgb, CanvasText 3%, Canvas); color: CanvasText }
      main { max-width: 54rem; margin: auto; padding: clamp(20px, 6vw, 72px) 20px }
      h1 { margin: 0 0 1rem; font-size: 1.15rem; letter-spacing: -.04em }
      form { margin-bottom: 1rem }
      label { display: block; font-weight: 600 }
      select, button { font: inherit; padding: .35rem .6rem }
    </style>
  </head>
  <body>
    <main>
      <h1>Draflow</h1>
      <form method="get">
        <label for="example">ワークフローを選択</label>
        <select id="example" name="example">
          <option value="manual-set">Manual → Set</option>
          <option value="workspace">作業用キャンバス（初回は空）</option>
          <option value="mock-http">Manual → HTTP（モック）</option>
        </select>
        <button type="submit">開く</button>
      </form>
      <button id="return-original" type="button" hidden>元の文書に戻る</button>
      <draflow-editor hidden theme="auto" locale="ja"></draflow-editor>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
