name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node examples/run-workflow.mjs
      - run: pnpm size
      - run: pnpm bench:expression

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: SQLite host on the minimum supported Node version
        run: node --test apps/server/test/*.test.mjs


  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - run: pnpm bench:canvas

  shared-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @draflow/server build
      - run: node --test --test-concurrency=1 apps/server/test/shared.test.mjs apps/server/test/distributed.test.mjs
        env:
          DRAFLOW_TEST_POSTGRES: postgres://postgres:local-ci-only@localhost:5432/postgres
      - run: node --test apps/server/test/compensation.test.mjs
        env:
          DRAFLOW_TEST_SHARED: postgres://postgres:local-ci-only@localhost:5432/postgres
      - run: node --test --test-name-pattern="before-admit|after-admit|before-return|after-return|after-token|after redrive acceptance" apps/server/test/composition-crash.test.mjs
        env:
          DRAFLOW_TEST_SHARED: postgres://postgres:local-ci-only@localhost:5432/postgres
      - run: node --test --test-name-pattern="parent cancellation immediately|uncertain manual delivery|delayed credential lookup|late duplicate redrive|parallel cancellation|failed page GET" apps/server/test/composition.test.mjs apps/server/test/sync.test.mjs
        env:
          DRAFLOW_TEST_SHARED: postgres://postgres:local-ci-only@localhost:5432/postgres
      - run: node --test --test-name-pattern="incremental tokens|parallel pages retain|two parallel imports|parallel receiver cooldown|occupied host|first GET attempt|during rate-limit wait" apps/server/test/sync.test.mjs
        env:
          DRAFLOW_TEST_SHARED: postgres://postgres:local-ci-only@localhost:5432/postgres
      - run: node --test apps/server/test/operator.test.mjs apps/server/test/business.test.mjs && node apps/server/test/operator-bench.mjs
        env:
          DRAFLOW_TEST_POSTGRES: postgres://postgres:local-ci-only@localhost:5432/postgres
      - run: node apps/server/test/postgres-ha.mjs

  prood-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: TommyKammy/Prood
          ref: a70531771b7b3f90123fcde0ccb17117ade8690d
          path: .prood
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm build
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: .prood
      - name: Exercise both ledgers and the authenticated rule preview
        env:
          PROOD_CHECKOUT: ${{ github.workspace }}/.prood
        run: |
          node --test apps/server/test/prood-business.test.mjs
          DRAFLOW_TEST_POSTGRES=postgres://postgres:local-ci-only@localhost:5432/postgres node --test apps/server/test/prood-business.test.mjs
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test prood-rule.spec.mjs
